    <script>
      function writeWord() 
      {
          const word = "KovanZ";
          const outputElement = document.getElementById("output");
          let currentIndex = 0;
          function writeCharacter()
          {
            if (currentIndex < word.length) 
              {
                  outputElement.textContent += word[currentIndex];
                  currentIndex++;
                  setTimeout(writeCharacter, 100);
              }
          }
           writeCharacter();
      }
          writeWord();
    </script>
